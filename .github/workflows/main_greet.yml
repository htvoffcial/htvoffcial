name: main-greet

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write
  actions: write
  
jobs:
  greet:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_MODEL: ${{ secrets.CF_MODEL }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      REPO: ${{ github.repository }}
      WORKFLOW_ID: main-greet.yml
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r .github/scripts/requirements.txt

      - name: Run scheduler + sender
        run: python .github/scripts/daily_greet.py
