name: Weekly npm and GitHub Release

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: weekly-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        working-directory: .github/scripts
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Copy root README
        run: cp README.md .github/scripts/README.md

      - name: Build
        run: npm --prefix .github/scripts run build --if-present

      - name: Test
        run: npm --prefix .github/scripts test --if-present

      - name: Bump version
        id: version
        working-directory: .github/scripts
        run: |
          NEW_TAG=$(npm version patch -m "chore(release): %s [skip ci]")
          echo "new_tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
          echo "new_version=${NEW_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Push release commit and tag
        run: |
          git push origin HEAD
          git push origin --tags

      # -------------------------
      # GitHub Packages
      # -------------------------

      - name: Configure GitHub Packages
        working-directory: .github/scripts
        run: |
          echo "@oniisan:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        working-directory: .github/scripts
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------
      # npmjs.com
      # -------------------------

      - name: Configure npmjs
        working-directory: .github/scripts
        run: |
          echo "@oniisan:registry=https://registry.npmjs.org" > .npmrc
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npmjs.com
        working-directory: .github/scripts
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          name: Release ${{ steps.version.outputs.new_tag }}
          generate_release_notes: true
